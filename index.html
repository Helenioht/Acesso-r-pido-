<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenium Navegador</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1920') no-repeat center center fixed; background-size: cover; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .container { 
            background: transparent; 
            padding: 30px; 
            border-radius: 20px; 
            width: 95%; 
            max-width: 600px; 
            text-align: center; 
        }

        .header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; background: rgba(255, 255, 255, 0.3); padding: 10px; border-radius: 10px; }
        .logo { width: 50px; height: 50px; }
        h1 { color: #fff; margin: 0; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.5); margin-bottom: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.2); color: white; }
        input::placeholder { color: rgba(255, 255, 255, 0.8); }
        .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 5px; transition: background 0.3s; }
        button:hover { background: rgba(255, 255, 255, 0.4); }
        
        button.ai-btn { background: rgba(138, 43, 226, 0.3); border-color: rgba(138, 43, 226, 0.5); }
        button.ai-btn:hover { background: rgba(138, 43, 226, 0.5); }

        /* Estilos da Caixa de Notícias */
        .news-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        .news-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .news-item {
            margin-bottom: 10px;
        }

        .news-item a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .news-item a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Estilização da barra de rolagem */
        .news-box::-webkit-scrollbar {
            width: 6px;
        }
        .news-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://i.ibb.co/fGPvnNkr/icone.png" alt="Icone" class="logo">
        <h1>Lenium Navegador</h1>
        <img src="https://i.ibb.co/n8Dvmqbr/logo.png" alt="Logo Lenium" class="logo">
    </div>
    
    <input type="text" id="query" placeholder="O que deseja buscar?">
    
    <div class="buttons">
        <button onclick="search('google')">Google</button>
        <button onclick="search('duckduckgo')">DuckDuckGo</button>
        <button onclick="search('bing')">Bing</button>
        <button class="ai-btn" onclick="openGemini()">Gemini AI</button>
    </div>

    <!-- Container da caixa de notícias -->
    <div class="news-box">
        <div class="news-title">Notícias em Tempo Real</div>
        <ul id="news-list" class="news-list">
            <li>Carregando notícias...</li>
        </ul>
    </div>
</div>

<script>
    function search(engine) {
        let q = document.getElementById('query').value;
        let urls = {
            'google': "https://www.google.com/search?q=",
            'duckduckgo': "https://duckduckgo.com/?q=",
            'bing': "https://www.bing.com/search?q="
        };
        if (q) window.location.href = urls[engine] + encodeURIComponent(q);
    }

    function openGemini() {
        let q = document.getElementById('query').value;
        
        if (q) {
            navigator.clipboard.writeText(q).then(() => {
                alert("Sua pergunta foi copiada! Cole-a (Ctrl+V) na caixa de texto do Gemini.");
                window.location.href = "https://gemini.google.com/app";
            }).catch(() => {
                window.location.href = "https://gemini.google.com/app";
            });
        } else {
            window.location.href = "https://gemini.google.com/app";
        }
    }

    // Função para buscar notícias via Feed RSS convertido para JSON
    async function loadNews() {
        const feedUrl = encodeURIComponent('https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419');
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            const newsList = document.getElementById('news-list');
            newsList.innerHTML = '';

            if (data.status === 'ok') {
                data.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'news-item';
                    li.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a>`;
                    newsList.appendChild(li);
                });
            } else {
                newsList.innerHTML = '<li>Não foi possível carregar as notícias.</li>';
            }
        } catch (error) {
            document.getElementById('news-list').innerHTML = '<li>Erro ao carregar notícias.</li>';
        }
    }

    // Carrega as notícias ao abrir a página
    loadNews();
</script>
</body>
</html>
